<svg width="960" height="1080" viewBox="0 0 960 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pattern A: Lighter Indigo/Silver for backgrounds -->
    <pattern id="stripA" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills - lighter version -->
      <rect x="0" y="0" width="14" height="88" fill="#e8ebf3"/>
      <rect x="14" y="0" width="4" height="88" fill="#f5f6f8"/>
      <rect x="18" y="0" width="6" height="88" fill="#dfe3ec"/>
      <rect x="24" y="0" width="3" height="88" fill="#f5f6f8"/>
      <rect x="27" y="0" width="14" height="88" fill="#e8ebf3"/>
      <rect x="41" y="0" width="2" height="88" fill="#fafbfc"/>
      <rect x="43" y="0" width="5" height="88" fill="#e8ebf3"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.6">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>

    <!-- Pattern B: Lighter Black/Red/Green -->
    <pattern id="stripB" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills - lighter version -->
      <rect x="0" y="0" width="18" height="88" fill="#d8d8d8"/>
      <rect x="18" y="0" width="3" height="88" fill="#f4c5c8"/>
      <rect x="21" y="0" width="6" height="88" fill="#d8d8d8"/>
      <rect x="27" y="0" width="3" height="88" fill="#c8e5da"/>
      <rect x="30" y="0" width="12" height="88" fill="#d8d8d8"/>
      <rect x="42" y="0" width="2" height="88" fill="#f4c5c8"/>
      <rect x="44" y="0" width="4" height="88" fill="#d8d8d8"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.5">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>

    <!-- Pattern C: Lighter Navy/Yellow/Red -->
    <pattern id="stripC" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills - lighter version -->
      <rect x="0" y="0" width="16" height="88" fill="#e3e5ed"/>
      <rect x="16" y="0" width="5" height="88" fill="#fef3d4"/>
      <rect x="21" y="0" width="8" height="88" fill="#e3e5ed"/>
      <rect x="29" y="0" width="4" height="88" fill="#f8d8db"/>
      <rect x="33" y="0" width="13" height="88" fill="#e3e5ed"/>
      <rect x="46" y="0" width="2" height="88" fill="#fef3d4"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" fill="none" opacity="0.6">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>
  </defs>

  <!-- Strip sequence: A A B A A C A A B A A A B A A C A A B A (20 strips) -->
  
  <!-- Strip 1: A -->
  <rect x="0" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 2: A -->
  <rect x="48" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 3: B -->
  <rect x="96" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 4: A (with vertical seam stitch) -->
  <rect x="144" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="168" y1="0" x2="168" y2="1080" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Strip 5: A -->
  <rect x="192" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 6: C -->
  <rect x="240" y="0" width="48" height="1080" fill="url(#stripC)"/>
  
  <!-- Strip 7: A -->
  <rect x="288" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 8: A (with vertical seam stitch) -->
  <rect x="336" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="360" y1="0" x2="360" y2="1080" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Strip 9: B -->
  <rect x="384" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 10: A -->
  <rect x="432" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 11: A -->
  <rect x="480" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 12: A (with vertical seam stitch) -->
  <rect x="528" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="552" y1="0" x2="552" y2="1080" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Strip 13: B -->
  <rect x="576" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 14: A -->
  <rect x="624" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 15: C -->
  <rect x="672" y="0" width="48" height="1080" fill="url(#stripC)"/>
  
  <!-- Strip 16: C (with vertical seam stitch) -->
  <rect x="720" y="0" width="48" height="1080" fill="url(#stripC)"/>
  <line x1="744" y1="0" x2="744" y2="1080" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
  
  <!-- Strip 17: A -->
  <rect x="768" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 18: A -->
  <rect x="816" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 19: B -->
  <rect x="864" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 20: A (with vertical seam stitch) -->
  <rect x="912" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="936" y1="0" x2="936" y2="1080" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
</svg>
