<svg width="960" height="1080" viewBox="0 0 960 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Pattern A: Indigo/Silver -->
    <pattern id="stripA" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills -->
      <rect x="0" y="0" width="14" height="88" fill="#1B2A6B"/>
      <rect x="14" y="0" width="4" height="88" fill="#B8BEC7"/>
      <rect x="18" y="0" width="6" height="88" fill="#2E3F8F"/>
      <rect x="24" y="0" width="3" height="88" fill="#B8BEC7"/>
      <rect x="27" y="0" width="14" height="88" fill="#1B2A6B"/>
      <rect x="41" y="0" width="2" height="88" fill="#D8DCE3"/>
      <rect x="43" y="0" width="5" height="88" fill="#1B2A6B"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#F2F1ED" stroke-width="1" stroke-dasharray="4 3" fill="none">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>

    <!-- Pattern B: Black/Red/Green -->
    <pattern id="stripB" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills -->
      <rect x="0" y="0" width="18" height="88" fill="#111112"/>
      <rect x="18" y="0" width="3" height="88" fill="#C1272D"/>
      <rect x="21" y="0" width="6" height="88" fill="#111112"/>
      <rect x="27" y="0" width="3" height="88" fill="#0F4D3A"/>
      <rect x="30" y="0" width="12" height="88" fill="#111112"/>
      <rect x="42" y="0" width="2" height="88" fill="#C1272D"/>
      <rect x="44" y="0" width="4" height="88" fill="#111112"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#EDEBE4" stroke-width="1" stroke-dasharray="4 3" fill="none">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>

    <!-- Pattern C: Navy/Yellow/Red -->
    <pattern id="stripC" x="0" y="0" width="48" height="88" patternUnits="userSpaceOnUse">
      <!-- Base stripe fills -->
      <rect x="0" y="0" width="16" height="88" fill="#1A1F4B"/>
      <rect x="16" y="0" width="5" height="88" fill="#F2B705"/>
      <rect x="21" y="0" width="8" height="88" fill="#1A1F4B"/>
      <rect x="29" y="0" width="4" height="88" fill="#D62828"/>
      <rect x="33" y="0" width="13" height="88" fill="#1A1F4B"/>
      <rect x="46" y="0" width="2" height="88" fill="#F2B705"/>
      <!-- Horizontal stitch lines every 22px -->
      <g stroke="#F5F0E1" stroke-width="1" stroke-dasharray="4 3" fill="none">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="22" x2="48" y2="22"/>
        <line x1="0" y1="44" x2="48" y2="44"/>
        <line x1="0" y1="66" x2="48" y2="66"/>
        <line x1="0" y1="88" x2="48" y2="88"/>
      </g>
    </pattern>
    
    <!-- Subtle fabric texture overlay (optional, 0.04 opacity) -->
    <filter id="fabricNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Strip sequence: A A B A A C A A B A A A B A A C A A B A (20 strips) -->
  
  <!-- Strip 1: A -->
  <rect x="0" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 2: A -->
  <rect x="48" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 3: B -->
  <rect x="96" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 4: A (with vertical seam stitch) -->
  <rect x="144" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="168" y1="0" x2="168" y2="1080" stroke="#F2F1ED" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Strip 5: A -->
  <rect x="192" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 6: C -->
  <rect x="240" y="0" width="48" height="1080" fill="url(#stripC)"/>
  
  <!-- Strip 7: A -->
  <rect x="288" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 8: A (with vertical seam stitch) -->
  <rect x="336" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="360" y1="0" x2="360" y2="1080" stroke="#F2F1ED" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Strip 9: B -->
  <rect x="384" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 10: A -->
  <rect x="432" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 11: A -->
  <rect x="480" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 12: A (with vertical seam stitch) -->
  <rect x="528" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="552" y1="0" x2="552" y2="1080" stroke="#F2F1ED" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Strip 13: B -->
  <rect x="576" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 14: A -->
  <rect x="624" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 15: A -->
  <rect x="672" y="0" width="48" height="1080" fill="url(#stripC)"/>
  
  <!-- Strip 16: C (with vertical seam stitch) -->
  <rect x="720" y="0" width="48" height="1080" fill="url(#stripC)"/>
  <line x1="744" y1="0" x2="744" y2="1080" stroke="#F5F0E1" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Strip 17: A -->
  <rect x="768" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 18: A -->
  <rect x="816" y="0" width="48" height="1080" fill="url(#stripA)"/>
  
  <!-- Strip 19: B -->
  <rect x="864" y="0" width="48" height="1080" fill="url(#stripB)"/>
  
  <!-- Strip 20: A (with vertical seam stitch) -->
  <rect x="912" y="0" width="48" height="1080" fill="url(#stripA)"/>
  <line x1="936" y1="0" x2="936" y2="1080" stroke="#F2F1ED" stroke-width="1" stroke-dasharray="4 3"/>
  
  <!-- Optional subtle fabric texture overlay at 0.04 opacity -->
  <rect x="0" y="0" width="960" height="1080" fill="black" opacity="0.04" filter="url(#fabricNoise)"/>
</svg>
