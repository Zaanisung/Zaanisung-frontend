<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaanisung</title>
    <meta name="description" content="Clean, luxury perfume e-commerce storefront and inventory admin platform for Zaanisung Ent. GH." />
    <meta property="og:title" content="Zaanisung" />
    <meta property="og:description" content="Clean, luxury perfume e-commerce storefront and inventory admin platform for Zaanisung Ent. GH." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("zaanisung-theme"); } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-black text-black dark:text-white antialiased selection:bg-[#D4AF37]/20 selection:text-black dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
